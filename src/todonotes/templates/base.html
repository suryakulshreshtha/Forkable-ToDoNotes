<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Notes{% endblock %} · {{ app_name }}</title>
  <script>
    /* Apply the saved theme before the first paint (avoids a flash of the wrong theme). */
    try {
      var saved = localStorage.getItem("todonotes-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) { /* private mode or blocked storage: follow the OS setting */ }
  </script>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span aria-hidden="true">📝</span> {{ app_name }}</a>
    <form class="search" role="search" action="{{ url_for('index') }}" method="get">
      <label for="q" class="visually-hidden">Search notes</label>
      <input id="q" name="q" type="search" value="{{ q or '' }}"
             placeholder="Search notes…  ( / )" autocomplete="off" maxlength="200">
    </form>
    <nav class="actions" aria-label="Main">
      <a class="button primary" href="{{ url_for('new_note') }}"><span aria-hidden="true">＋</span> New note</a>
      <button type="button" class="button ghost" data-theme-toggle aria-label="Switch light or dark theme" title="Switch theme">
        <span aria-hidden="true">🌓</span>
      </button>
    </nav>
  </header>
  <div class="palette-strip" aria-hidden="true"></div>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ app_name }} v{{ version }} · works offline</span>
    <span>Search: {{ search_engine }}</span>
    <span>Export: <a href="{{ url_for('export_json') }}">JSON</a> · <a href="{{ url_for('export_markdown') }}">Markdown</a></span>
  </footer>
</body>
</html>
