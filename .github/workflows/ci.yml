# CI — runs on every push to main and every pull request.
#
#   lint ──┐
#   unit ──┼──► ci-gate   (the ONE check to require in branch protection)
#   e2e  ──┘
#
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false   # show every OS/version result, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m unit

  e2e:
    name: E2E · Playwright · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium and its Linux system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests (keep a trace + screenshot only when a test fails)
        run: python -m pytest -m e2e --tracing retain-on-failure --screenshot only-on-failure
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  ci-gate:
    name: CI gate
    needs: [lint, unit, e2e]
    if: always()   # run even when a needed job failed, so the gate can report it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "lint : ${{ needs.lint.result }}"
          echo "unit : ${{ needs.unit.result }}"
          echo "e2e  : ${{ needs.e2e.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::CI gate failed: at least one required job did not succeed."
            exit 1
          fi
          echo "✅ All required jobs passed."
