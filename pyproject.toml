# pyproject.toml — one file that describes the project to every Python tool.
# Packaging spec: https://packaging.python.org/en/latest/specifications/pyproject-toml/

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forkable-todonotes"
dynamic = ["version"]   # read from src/todonotes/__init__.py (single source of truth)
description = "A standalone, offline-first notes + to-do app (Flask + SQLite), built chapter by chapter as a learning repo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surya Kulshreshtha" }]
keywords = ["notes", "todo", "flask", "sqlite", "playwright", "learning", "forkable"]
# Ranges here (what the code is compatible with); exact pins live in requirements.txt.
dependencies = [
    "flask>=3.1,<4",
    "waitress>=3.0,<4",
]

[project.scripts]
todonotes = "todonotes.__main__:main"

[project.urls]
Repository = "https://github.com/suryakulshreshtha/Forkable-ToDoNotes"
Index = "https://github.com/suryakulshreshtha/SuryaKulshreshtha"

[tool.setuptools.dynamic]
version = { attr = "todonotes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
todonotes = ["templates/*.html", "static/*"]

# ---------------------------------------------------------------- ruff (lint)
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.format]
# Ruff can also format Python blocks inside Markdown. The chapters show deliberately
# partial excerpts (checked against the real files by tests/unit/test_docs.py), so skip them.
exclude = ["*.md"]

[tool.ruff.lint]
# E/F: errors · I: import order · UP: modern syntax · B: likely bugs
select = ["E", "F", "I", "UP", "B"]

# --------------------------------------------------------------- pytest
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "unit: fast tests with no browser (auto-applied to tests/unit)",
    "e2e: Playwright browser tests (auto-applied to tests/e2e)",
    "smoke: the few tests that prove the app starts and works at all",
]
